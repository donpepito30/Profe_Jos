name = "aulas-activas-profe-juan"
main = "src/index.ts"
compatibility_date = "2024-04-05"

# Durable Object binding for Realtime Sessions
[[durable_objects.bindings]]
name = "TUTOR_SESSION"
class_name = "TutorSession"

[[migrations]]
tag = "v1"
new_classes = ["TutorSession"]

# D1 Database binding for storing DCD evaluations
[[d1_databases]]
binding = "DB"
database_name = "aulas-activas-dcd"
database_id = "YOUR_D1_DATABASE_ID"

# Use Wrangler to set secrets
# npx wrangler secret put GEMINI_API_KEY
