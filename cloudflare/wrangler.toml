name = "profe-jos"
main = "../dist/_worker.js"
compatibility_date = "2024-04-05"

[assets]
directory = "../dist"
binding = "ASSETS"

# D1 Database binding for storing DCD evaluations
[[d1_databases]]
binding = "DB"
database_name = "aulas-activas-dcd"
database_id = "YOUR_D1_DATABASE_ID"

# Cloudflare deployment setup
# 1) npx wrangler secret put GEMINI_API_KEY
# 2) npx wrangler d1 create aulas-activas-dcd
# 3) npx wrangler deploy
